<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>a-Lamina - L'Aventure des Cristaux Magiques</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle, #2e1065 0%, #1e1b4b 60%, #09090b 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><text y='20' font-size='20'>🔨</text></svg>"), auto;
        }

        #game-container {
            text-align: center;
            background: linear-gradient(180deg, #4c1d95 0%, #2e1065 100%);
            padding: 18px;
            border-radius: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(244, 114, 182, 0.35);
            border: 6px solid #f472b6;
            position: relative;
            max-width: 440px;
            width: 100%;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            color: #fef08a;
            letter-spacing: 1.5px;
            font-size: 1.6rem;
            text-shadow: 0 3px 6px rgba(0,0,0,0.8), 0 0 15px #f472b6;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: linear-gradient(180deg, #ec4899 0%, #be185d 100%);
            color: #ffffff;
            border: 3px solid #fef08a;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #831843, 0 8px 12px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }
        .btn-icon:active { transform: translateY(4px); box-shadow: 0 1px 0 #831843; }

        #level-info {
            font-size: 1rem;
            color: #fef08a;
            margin-bottom: 10px;
            text-align: left;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            padding: 10px 14px;
            border-radius: 20px;
            border: 3px solid #38bdf8;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.7), 0 5px 10px rgba(0,0,0,0.4);
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        .hud-score-row {
            font-size: 0.95rem;
            color: #fef08a;
            font-weight: 800;
        }
        .hud-score-row span { color: #38bdf8; }

        .hud-top-row {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 700;
        }
        .hud-top-row span { color: #34d399; }

        .moves-box {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            border: 3px solid #fef08a;
            border-radius: 18px;
            padding: 6px 14px;
            min-width: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #b45309, 0 8px 12px rgba(0,0,0,0.5);
        }

        #moves {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
        }

        .moves-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: #fef08a;
            text-transform: uppercase;
        }

        canvas {
            background-color: #09090b;
            border: 4px solid #38bdf8;
            border-radius: 22px;
            touch-action: none;
            cursor: pointer;
            width: 100%;
            height: auto;
            max-width: 364px;
            max-height: 364px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.95), 0 0 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 8px;
        }

        .powerups-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
            margin-bottom: 6px;
            align-items: center;
        }

        .powerup-icon-btn {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 3px solid #fef08a;
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #0369a1, 0 8px 12px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s ease;
        }
        .powerup-icon-btn.active {
            border-color: #ffffff;
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 15px #34d399, 0 5px 0 #047857;
            transform: scale(1.08);
        }
        .powerup-icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0369a1; }

        .powerup-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 12px;
            border: 2px solid #fef08a;
        }

        .instructions {
            margin-top: 4px;
            font-size: 0.9rem;
            color: #fef08a;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.12);
            padding: 7px;
            border-radius: 14px;
            border: 2px dashed #f472b6;
        }

        #settings-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.97);
            border-radius: 36px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 24px;
            border: 6px solid #38bdf8;
        }

        #settings-modal h2 { color: #fef08a; font-size: 1.8rem; margin-bottom: 5px; }
        .modal-btn {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            color: white; border: 3px solid #bae6fd;
            padding: 12px 20px; border-radius: 20px; font-weight: 800; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 6px 0 #0369a1, 0 10px 15px rgba(0,0,0,0.4);
            width: 90%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .modal-btn.danger { background: linear-gradient(180deg, #fb7185 0%, #e11d48 100%); border-color: #fecdd3; box-shadow: 0 6px 0 #9f1239; }
        .modal-btn.warning { background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%); border-color: #fde68a; box-shadow: 0 6px 0 #b45309; }
        .modal-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #0369a1; }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header-top">
            <h1>✨ a-Lamina</h1>
            <div class="header-buttons">
                <button id="settings-btn" class="btn-icon" title="Paramètres Magiques">🔮</button>
                <button id="pause-btn" class="btn-icon" title="Pause Magique">⏳</button>
            </div>
        </div>
        <div id="level-info">Niv. 1 • Cristaux Magiques</div>

        <div class="hud">
            <div class="hud-left">
                <div class="hud-score-row">🎯 Score : <span id="score">0</span> / <span id="target-score">500</span></div>
                <div class="hud-top-row">🏆 Top : <span id="high-score">0</span></div>
            </div>
            <div class="moves-box">
                <div id="moves">18</div>
                <div class="moves-label">Coups</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="380" height="380"></canvas>

        <div class="powerups-bar">
            <button id="pu-hammer" class="powerup-icon-btn" title="Marteau Magique">
                🔨
                <span id="hammer-badge" class="powerup-badge">3</span>
            </button>
            <button id="pu-shuffle" class="powerup-icon-btn" title="Mélangeur Magique">
                🔀
                <span id="shuffle-badge" class="powerup-badge">2</span>
            </button>
        </div>

        <div class="instructions">⭐ Aligne 3 cristaux magiques ou plus ! ⭐</div>

        <div id="settings-modal">
            <h2>🔮 Paramètres Magiques</h2>
            <button id="modal-sound" class="modal-btn">🔊 Bruitages : <span id="sound-txt">ACTIVÉS</span></button>
            <button id="modal-music" class="modal-btn">🎵 Musique : <span id="music-txt">ACTIVÉE</span></button>
            <button id="modal-colorblind" class="modal-btn" style="background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); border-color: #c4b5fd; box-shadow: 0 6px 0 #4c1d95;">👁️ Mode Daltonien : <span id="colorblind-txt">DÉSACTIVÉ</span></button>
            <button id="modal-refresh" class="modal-btn warning">🪄 Actualiser la Partie</button>
            <button id="modal-reset" class="modal-btn danger">🍄 Recommencer au Niveau 1</button>
            <button id="modal-close" class="modal-btn" style="background: linear-gradient(180deg, #64748b 0%, #334155 100%); border-color: #cbd5e1; box-shadow: 0 6px 0 #1e293b;">🚪 Fermer</button>
        </div>
    </div>

    <script src="src/game.js"></script>
</body>
</html>
