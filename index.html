<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A-LAMINA - Niveau 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
        }
        h1 {
            margin-bottom: 5px;
            color: #f43f5e;
            letter-spacing: 2px;
            font-size: 1.8rem;
        }
        #level-info {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .hud {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1rem;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .hud span {
            color: #38bdf8;
            font-weight: bold;
        }
        canvas {
            background-color: #0f172a;
            border: 3px solid #475569;
            border-radius: 8px;
            touch-action: none;
            cursor: pointer;
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>A-LAMINA</h1>
        <div id="level-info">Niveau 1 : Alignez 3 blocs identiques</div>
        <div class="hud">
            <div>Score : <span id="score">0</span> / <span id="target-score">500</span></div>
            <div>Coups : <span id="moves">15</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="instructions">Cliquez sur deux blocs adjacents pour les �changer !</div>
    </div>

    <!-- Lien vers le fichier JavaScript dans le dossier src -->
    <script src="src/game.js"></script>
</body>
</html>
