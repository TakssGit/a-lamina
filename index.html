<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A-LAMINA - Match 3 Gem Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            text-align: center;
            background: #1e293b;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            position: relative;
            max-width: 440px;
            width: 100%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h1 {
            color: #f43f5e;
            letter-spacing: 2px;
            font-size: 1.6rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .header-buttons {
            display: flex;
            gap: 6px;
        }
        .btn-ui {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-ui:hover { background: #475569; }
        #level-info {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 10px;
            text-align: left;
        }
        .hud {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
            font-size: 0.9rem;
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
            gap: 10px;
        }
        .hud span {
            color: #38bdf8;
            font-weight: bold;
        }
        canvas {
            background-color: #0f172a;
            border: 3px solid #475569;
            border-radius: 8px;
            touch-action: none;
            cursor: pointer;
            width: 100%;
            height: auto;
            max-width: 380px;
            max-height: 380px;
        }
        .instructions {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header-top">
            <h1>A-LAMINA</h1>
            <div class="header-buttons">
                <button id="mute-btn" class="btn-ui">🔊</button>
                <button id="pause-btn" class="btn-ui">PAUSE</button>
            </div>
        </div>
        <div id="level-info">Menu Principal</div>
        <div class="hud">
            <div>Score : <span id="score">0</span> / <span id="target-score">500</span></div>
            <div>Top : <span id="high-score">0</span></div>
            <div>Coups : <span id="moves">15</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="instructions">Alignez 3 gemmes identiques pour déclencher des combos !</div>
    </div>

    <script src="src/game.js"></script>
</body>
</html>
